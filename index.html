<!DOCTYPE html>
<html>
<head>
    <title>Zomball Stats</title>
    <style>
        #stats { display: block; }
        table { border-collapse: collapse; }
        td { padding: 2px 12px; vertical-align: top; }
        td.divider { border-top: 1px solid #999; }
    </style>
</head>
<body>
    <div id="stats"></div>
    <script src="data.js"></script>
    <script>
        getData().then(matches => {
            const games = getGamesByAuthPlayers(matches);
            const tags = getValidTagsByAuthPlayers(matches);
            const survival = getSurvivalTimeByAuthPlayers(matches);
            const survivalPerZombie = getSurvivalTimePerZombieByAuthPlayers(matches);
            const gameCountPerZombie = getGameCountPerZombieByAuthPlayers(matches);
            const firstLastNever = getFirstLastNeverByAuthPlayers(matches);
            const initialZombie = getInitialZombieCountByAuthPlayers(matches);

            const byZombieCount = {};
            const avgByZombieCount = {};
            for (const [name, zombieCounts] of Object.entries(survivalPerZombie)) {
                for (const [z, t] of Object.entries(zombieCounts)) {
                    if (!byZombieCount[z]) byZombieCount[z] = [];
                    if (!avgByZombieCount[z]) avgByZombieCount[z] = [];
                    byZombieCount[z].push(name + ': ' + t);
                    const gameCount = (gameCountPerZombie[name] && gameCountPerZombie[name][z]) || 1;
                    avgByZombieCount[z].push(name + ': ' + (t / gameCount).toFixed(1));
                }
            }

            const columns = [];

            columns.push({ title: 'Total Games', entries: ['Total: ' + getTotalGames(matches)], avgTitle: null, avgEntries: [] });
            columns.push({ title: 'Games Played', entries: Object.entries(games).map(([n, c]) => n + ': ' + c), avgTitle: null, avgEntries: [] });
            columns.push({
                title: 'Valid Tags',
                entries: Object.entries(tags).map(([n, c]) => n + ': ' + c),
                avgTitle: 'Avg valid tags per game',
                avgEntries: Object.entries(tags).map(([n, c]) => n + ': ' + (c / (games[n] || 1)).toFixed(2))
            });
            columns.push({
                title: 'Survival Time (frames)',
                entries: Object.entries(survival).map(([n, f]) => n + ': ' + f),
                avgTitle: 'Avg survival time per game',
                avgEntries: Object.entries(survival).map(([n, f]) => n + ': ' + (f / (games[n] || 1)).toFixed(1))
            });
            for (const z of Object.keys(byZombieCount).sort((a, b) => a - b)) {
                columns.push({
                    title: 'Survival vs ' + z + 'z',
                    entries: byZombieCount[z],
                    avgTitle: 'Avg survival vs ' + z + 'z',
                    avgEntries: avgByZombieCount[z]
                });
            }
            columns.push({
                title: 'First To Die',
                entries: Object.entries(firstLastNever).map(([n, s]) => n + ': ' + s.firstToDie),
                avgTitle: 'Avg first to die rate',
                avgEntries: Object.entries(firstLastNever).map(([n, s]) => n + ': ' + (s.firstToDie / (games[n] || 1)).toFixed(2))
            });
            columns.push({
                title: 'Last Alive',
                entries: Object.entries(firstLastNever).map(([n, s]) => n + ': ' + s.lastAlive),
                avgTitle: 'Avg last alive rate',
                avgEntries: Object.entries(firstLastNever).map(([n, s]) => n + ': ' + (s.lastAlive / (games[n] || 1)).toFixed(2))
            });
            columns.push({
                title: 'Never Died',
                entries: Object.entries(firstLastNever).map(([n, s]) => n + ': ' + s.neverDied),
                avgTitle: 'Avg survival rate',
                avgEntries: Object.entries(firstLastNever).map(([n, s]) => n + ': ' + (s.neverDied / (games[n] || 1)).toFixed(2))
            });
            columns.push({
                title: 'Initial Zombie',
                entries: Object.entries(initialZombie).map(([n, c]) => n + ': ' + c),
                avgTitle: 'Avg times starting zombie',
                avgEntries: Object.entries(initialZombie).map(([n, c]) => n + ': ' + (c / (games[n] || 1)).toFixed(2))
            });

            const maxEntries = Math.max(...columns.map(c => c.entries.length));
            const maxAvgEntries = Math.max(...columns.map(c => c.avgEntries.length));
            const hasAvg = columns.some(c => c.avgEntries.length > 0);

            const table = document.createElement('table');

            const headerRow = table.insertRow();
            for (const col of columns) {
                const cell = headerRow.insertCell();
                const strong = document.createElement('strong');
                strong.textContent = col.title;
                cell.appendChild(strong);
            }

            for (let i = 0; i < maxEntries; i++) {
                const row = table.insertRow();
                for (const col of columns) {
                    const cell = row.insertCell();
                    cell.textContent = col.entries[i] || '';
                }
            }

            if (hasAvg) {
                const avgHeaderRow = table.insertRow();
                for (const col of columns) {
                    const cell = avgHeaderRow.insertCell();
                    cell.className = 'divider';
                    if (col.avgTitle) {
                        const strong = document.createElement('strong');
                        strong.textContent = col.avgTitle;
                        cell.appendChild(strong);
                    }
                }

                for (let i = 0; i < maxAvgEntries; i++) {
                    const row = table.insertRow();
                    for (const col of columns) {
                        const cell = row.insertCell();
                        cell.textContent = col.avgEntries[i] || '';
                    }
                }
            }

            document.getElementById('stats').appendChild(table);
        });
    </script>
</body>
</html>
