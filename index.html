<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomball Stats Parser</title>
    
    <script src="./decoder.js"></script>
    <script src="./zomball.js"></script>
    <script src="./statAggregator.js"></script>
</head>
<body>

    <h2>Zomball Survival Analytics</h2>
    
    <div style="margin-bottom: 15px;">
        <label for="jsonFileInput"><strong>Option 1:</strong> Upload Zomball tagpro.eu file</label><br>
        <input type="file" id="jsonFileInput" accept=".json" multiple>
    </div>
    
    <div style="margin-bottom: 15px;">
        <label for="matchIdInput"><strong>Option 2:</strong> Enter tagpro.eu Match ID</label><br>
        <input type="text" id="matchIdInput" placeholder="e.g., 4301360" style="padding: 4px; width: 120px;">
        <button id="fetchButton" style="padding: 4px 10px;">Load Match</button>
    </div>

    <p id="errorLog" style="color: red; font-weight: bold;"></p>

    <br>

    <table id="resultsTable" border="1" style="display: none; border-collapse: collapse; text-align: left;">
        <thead id="tableHead">
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>

    <script>
        // Shared pipeline to handle processing regardless of the data source
        async function processMatchData(filesOrBlobs) {
            const errorLog = document.getElementById('errorLog');
            const resultsTable = document.getElementById('resultsTable');
            
            // Reset UI
            errorLog.innerText = '';
            resultsTable.style.display = 'none';

            try {
                // STEP 1: Decode the input JSON file(s) or blob(s)
                const options = { gameinfo: true, players: true, team: true, map: true, splats: true };
                const decodedResult = await window.TagProDecoder.decodeMatchFiles(filesOrBlobs, options);

                // STEP 1.5: Extract the first match from the array
                const rawMatchData = Array.isArray(decodedResult) ? decodedResult[0] : decodedResult;

                // STEP 2: Create Zomball Timeline
                const processedTimeline = window.processZomballMatch(rawMatchData);

                // STEP 3: Aggregate Stats
                const stats = window.aggregateZomballStats(processedTimeline);

                // STEP 4: Render UI Table
                renderTable(stats);

            } catch (error) {
                console.error("Pipeline Error:", error);
                errorLog.innerText = "Error: " + error.message;
            }
        }

        // Event Listener for File Uploads
        document.getElementById('jsonFileInput').addEventListener('change', function(event) {
            const files = event.target.files;
            if (!files.length) return;
            processMatchData(files);
        });

        // Event Listener for Match ID URL Fetching
        document.getElementById('fetchButton').addEventListener('click', async function() {
            const matchId = document.getElementById('matchIdInput').value.trim();
            const errorLog = document.getElementById('errorLog');
            
            if (!matchId) {
                errorLog.innerText = "Please enter a valid Match ID.";
                return;
            }

            errorLog.innerText = "Fetching match data from tagpro.eu...";

            try {
                const url = `https://tagpro.eu/data/?match=${matchId}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                const blob = await response.blob();
                
                // Wrap the blob in an array so TagProDecoder can loop through it like a FileList
                await processMatchData([blob]);
                
            } catch (error) {
                console.error("Fetch Error:", error);
                errorLog.innerText = "Fetch Error: " + error.message + 
                    "\n\n(Note: If this is a Cross-Origin/CORS error, your browser is blocking the request. You may need a CORS proxy or browser extension to download directly from tagpro.eu via a local file).";
            }
        });

        /**
         * Consumes the aggregated stats object and dynamically builds the HTML table.
         */
        function renderTable(stats) {
            const { uniqueZombieCounts, playerStats } = stats;

            playerStats.sort((a, b) => {
                // Force Alpha zombies to the bottom
                if (a.isAlpha && !b.isAlpha) return 1;
                if (!a.isAlpha && b.isAlpha) return -1;
                if (a.isAlpha && b.isAlpha) return 0;
                
                // Sort remaining players by totalSurvivalSeconds descending
                return b.totalSurvivalSeconds - a.totalSurvivalSeconds;
            });

            // --- Build Headers ---
            let thead = `<tr>
                <th style="padding: 5px;">Player Name</th>
                <th style="padding: 5px;">Total Survival Time</th>`;
                    
            uniqueZombieCounts.forEach(count => {
                thead += `<th style="padding: 5px;">Vs ${count} Zombie${count > 1 ? 's' : ''}</th>`;
            });

            thead += `<th style="padding: 5px;">Zombies On Death</th>
                <th style="padding: 5px;">Tags</th>
            </tr>`;
            document.getElementById('tableHead').innerHTML = thead;

            // --- Build Body Rows ---
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            playerStats.forEach(player => {
                let rowHTML = `<td style="padding: 5px;"><strong>${player.name}</strong></td>`;
                
                // Total Survival Time Column
                if (player.isAlpha) {
                    rowHTML += `<td style="padding: 5px;">N/A (Alpha)</td>`;
                } else {
                    rowHTML += `<td style="padding: 5px;">${player.totalSurvivalSeconds.toFixed(2)}s</td>`;
                }
                
                // Dynamic "Vs N Zombies" Columns
                uniqueZombieCounts.forEach(c => {
                    if (player.isAlpha) {
                        rowHTML += `<td style="padding: 5px;">N/A</td>`;
                    } else {
                        const seconds = (player.vsTimes[c] / 60).toFixed(2);
                        rowHTML += `<td style="padding: 5px;">${seconds > 0 ? seconds + 's' : '-'}</td>`;
                    }
                });

                // Ending columns
                rowHTML += `<td style="padding: 5px;">${player.isAlpha ? 'N/A' : player.zombiesAtDeath}</td>
                    <td style="padding: 5px;">${player.validTags}</td>`;
                
                const tr = document.createElement('tr');
                tr.innerHTML = rowHTML;
                tbody.appendChild(tr);
            });

            // Display the table
            document.getElementById('resultsTable').style.display = 'table';
        }
    </script>

</body>
</html>
